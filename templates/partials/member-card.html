<article class="member-profile">

    {{MEMBER_LABEL}}
    {{MEMBER_PHOTO}}
    <div class="profile-identity-text">
      <h3>{{MEMBER_NAME}}</h3>
      {{MEMBER_ENGLISH}}

  <div class="profile-details">{{MEMBER_DETAILS}}</div>
